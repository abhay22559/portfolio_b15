<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Header</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <!-- Logo -->
        <a href="#home" class="logo"> Alex<span>.</span> </a>

        <!-- Navigation Links -->
        <ul class="nav-links" id="navLinks">
          <li><a href="#home" class="nav-link active">Home</a></li>
          <li><a href="#contact" class="nav-link">Contact</a></li>
          <li><a href="#blog" class="nav-link">Blog</a></li>

          <li class="mobile-resume">
            <a href="resume.pdf" download class="resume-btn">
              Download Resume
            </a>
          </li>
        </ul>

        <!-- Desktop Resume Button -->
        <a href="resume.pdf" download class="resume-btn desktop-resume">
          Download Resume
          <span>↓</span>
        </a>

        <!-- Mobile Menu Button -->
        <button
          class="menu-toggle"
          id="menuToggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="navLinks"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </nav>
    </header>

    <main>
      <section id="home" class="hero">
        <p class="intro">HELLO, I'M ALEX</p>
        <h1>
          Building digital experiences<br />
          with <span>passion.</span>
        </h1>
        <p class="description">
          Front End Developer | UI Enthusiast | Creative Thinker
        </p>
      </section>

      <section id="contact" class="content-section">
        <h2>Contact Me</h2>
      </section>

      <section id="blog" class="content-section">
        <h2>My Blog</h2>
      </section>
    </main>

    <script>
      const menuToggle = document.getElementById("menuToggle");
      const navLinks = document.getElementById("navLinks");

      menuToggle.addEventListener("click", () => {
        const isOpen = navLinks.classList.toggle("show");

        menuToggle.classList.toggle("active", isOpen);
        menuToggle.setAttribute("aria-expanded", isOpen);
      });

      // Close menu after clicking a navigation link
      document.querySelectorAll(".nav-link").forEach((link) => {
        link.addEventListener("click", () => {
          navLinks.classList.remove("show");
          menuToggle.classList.remove("active");
          menuToggle.setAttribute("aria-expanded", "false");
        });
      });
    </script>
  </body>
</html>
